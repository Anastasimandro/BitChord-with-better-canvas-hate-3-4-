name: Android NPU Delegate Tests

on:
  push:
    branches: [main]
    paths:
      - 'shared/src/jvmSharedMain/kotlin/com/music/bitchord/playback/smart/BeatTracker.kt'
      - 'app/src/androidTest/java/com/music/bitchord/playback/smart/BeatTrackerNpuParityTest.kt'
      - 'app/src/androidTest/java/com/music/bitchord/playback/smart/BeatTrackerBenchmarkTest.kt'
      - '.github/workflows/android-npu-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'shared/src/jvmSharedMain/kotlin/com/music/bitchord/playback/smart/BeatTracker.kt'
      - 'app/src/androidTest/java/com/music/bitchord/playback/smart/BeatTrackerNpuParityTest.kt'
      - 'app/src/androidTest/java/com/music/bitchord/playback/smart/BeatTrackerBenchmarkTest.kt'
      - '.github/workflows/android-npu-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npu-parity-test:
    name: NPU Delegate Parity Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_AVD_HOME: /home/runner/.config/.android/avd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Android SDK
        id: cache-android-sdk
        uses: actions/cache@v4
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Install Android SDK (if not cached)
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/emulator" >> $GITHUB_PATH

      - name: Install Android SDK components (API 30, x86_64 system image)
        run: |
          yes | sdkmanager --licenses > /dev/null
          # Install components needed for the build: compileSdk=34 (Android 14), NDK, Build-Tools 35
          # Note: compileSdk=37 in build.gradle.kts requires preview platform; install from canary channel
          sdkmanager "platforms;android-34" "platforms;android-30" "system-images;android-30;default;x86_64" "emulator" "platform-tools" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          # Try stable channel first (Gradle recognizes stable platforms), fall back to canary
          sdkmanager "platforms;android-37" || sdkmanager --channel=3 "platforms;android-37" || true

      - name: Create android-37 platform directory (Gradle looks for android-37, not android-37.0)
        run: |
          # The canary channel installs as android-37.0 but Gradle looks for android-37.
          # COPY (not symlink) so Gradle sees a real directory and doesn't re-install.
          # Run ALWAYS (not cache-dependent).
          if [ -d "/opt/android-sdk/platforms/android-37.0" ] && [ ! -d "/opt/android-sdk/platforms/android-37" ]; then
            cp -r /opt/android-sdk/platforms/android-37.0 /opt/android-sdk/platforms/android-37
            echo "Copied android-37.0 -> android-37"
          elif [ -d "/opt/android-sdk/platforms/android-37" ]; then
            echo "Directory android-37 already exists"
          else
            echo "WARNING: android-37.0 not found in /opt/android-sdk/platforms/"
            ls -la /opt/android-sdk/platforms/
          fi

      - name: Enable KVM for x86_64 emulator
        run: |
          # GitHub Actions runners have KVM but the user isn't in the kvm group by default
          sudo usermod -a -G kvm $USER
          # Verify KVM access
          ls -la /dev/kvm

      - name: Create and start emulator (x86_64 for NNAPI)
        run: |
          # Create AVD (wait for completion)
          echo "no" | avdmanager create avd -n test -k "system-images;android-30;default;x86_64" --force
          # Verify AVD was created
          avdmanager list avd
          # Fix AVD config: the AVD stores the system image path at creation time.
          # On GitHub Actions, avdmanager may resolve the system image to a relative path
          # or the default SDK location. Set the absolute path to our custom SDK.
          AVD_CONFIG="$ANDROID_AVD_HOME/test.avd/config.ini"
          if [ -f "$AVD_CONFIG" ]; then
            # Replace any relative or default SDK path with our custom SDK absolute path
            sed -i 's|^image.sysdir.1=.*|image.sysdir.1=/opt/android-sdk/system-images/android-30/default/x86_64/|' "$AVD_CONFIG"
            echo "Updated AVD config:"
            cat "$AVD_CONFIG"
          fi
          # Start emulator in background with kvm group (required for x86_64 hardware acceleration)
          # Use 'sg kvm' to run with the kvm group membership from usermod
          sg kvm -c 'emulator -avd test -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -qemu -cpu max &' &
          # Wait for boot with longer timeout (emulator can be slow on CI)
          timeout 300 bash -c 'adb wait-for-device shell "while [[ -z \$(getprop sys.boot_completed) ]]; do sleep 1; done"'
          adb shell input keyevent 82

      - name: Run NPU Parity Test
        run: |
          ./gradlew :app:connectedDevDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.music.bitchord.playback.smart.BeatTrackerNpuParityTest \
            -Dandroid.autoInstallSdk=false \
            --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npu-parity-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7

