name: Android NPU Delegate Tests

on:
  push:
    branches: [main]
    paths:
      - 'shared/src/jvmSharedMain/kotlin/com/music/bitchord/playback/smart/BeatTracker.kt'
      - 'app/src/androidTest/java/com/music/bitchord/playback/smart/BeatTrackerNpuParityTest.kt'
      - 'app/src/androidTest/java/com/music/bitchord/playback/smart/BeatTrackerBenchmarkTest.kt'
      - '.github/workflows/android-npu-tests.yml'
  pull_request:
    paths:
      - 'shared/src/jvmSharedMain/kotlin/com/music/bitchord/playback/smart/BeatTracker.kt'
      - 'app/src/androidTest/java/com/music/bitchord/playback/smart/BeatTrackerNpuParityTest.kt'
      - 'app/src/androidTest/java/com/music/bitchord/playback/smart/BeatTrackerBenchmarkTest.kt'
      - '.github/workflows/android-npu-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npu-parity-test:
    name: NPU Delegate Parity Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Android SDK (with caching)
        uses: android-actions/setup-android@v3
        with:
          cache-key: android-sdk-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts', '**/gradle.properties') }}

      - name: Install API 30 and x86_64 system image
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-30" "system-images;android-30;default;x86_64" "emulator" "platform-tools" "build-tools;34.0.0"

      - name: Create and start emulator (x86_64 for NNAPI)
        run: |
          echo "no" | avdmanager create avd -n test -k "system-images;android-30;default;x86_64" --force
          emulator -avd test -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -qemu -cpu max &
          # Wait for boot with timeout
          timeout 120 bash -c 'adb wait-for-device shell "while [[ -z \$(getprop sys.boot_completed) ]]; do sleep 1; done"'
          adb shell input keyevent 82

      - name: Run NPU Parity Test
        run: |
          ./gradlew :app:connectedDevDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.music.bitchord.playback.smart.BeatTrackerNpuParityTest \
            --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npu-parity-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7

  npu-benchmark-test:
    name: NPU Delegate Benchmark (Cold L0)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Android SDK (with caching)
        uses: android-actions/setup-android@v3
        with:
          cache-key: android-sdk-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts', '**/gradle.properties') }}

      - name: Install API 30 and x86_64 system image
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-30" "system-images;android-30;default;x86_64" "emulator" "platform-tools" "build-tools;34.0.0"

      - name: Create and start emulator (x86_64 for NNAPI)
        run: |
          echo "no" | avdmanager create avd -n test -k "system-images;android-30;default;x86_64" --force
          emulator -avd test -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -qemu -cpu max &
          timeout 120 bash -c 'adb wait-for-device shell "while [[ -z \$(getprop sys.boot_completed) ]]; do sleep 1; done"'
          adb shell input keyevent 82

      - name: Run NPU Benchmark Test
        run: |
          ./gradlew :app:connectedDevDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.music.bitchord.playback.smart.BeatTrackerBenchmarkTest \
            --no-daemon

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npu-benchmark-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7

  delegate-availability:
    name: NPU Delegate Availability Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Android SDK (with caching)
        uses: android-actions/setup-android@v3
        with:
          cache-key: android-sdk-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts', '**/gradle.properties') }}

      - name: Install API 30 and x86_64 system image
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-30" "system-images;android-30;default;x86_64" "emulator" "platform-tools" "build-tools;34.0.0"

      - name: Create and start emulator (x86_64 for NNAPI)
        run: |
          echo "no" | avdmanager create avd -n test -k "system-images;android-30;default;x86_64" --force
          emulator -avd test -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -qemu -cpu max &
          timeout 120 bash -c 'adb wait-for-device shell "while [[ -z \$(getprop sys.boot_completed) ]]; do sleep 1; done"'
          adb shell input keyevent 82

      - name: Check delegate availability
        run: |
          ./gradlew :app:connectedDevDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.music.bitchord.playback.smart.BeatTrackerNpuParityTest#npuDelegateParity \
            --no-daemon

      - name: Print delegate availability
        run: |
          find app/build/outputs/androidTest-results -name "*.xml" -exec grep -l "Delegate availability" {} \;