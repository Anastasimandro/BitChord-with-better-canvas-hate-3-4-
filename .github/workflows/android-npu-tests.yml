name: Android NPU Delegate Tests

on:
  push:
    branches: [main]
    paths:
      - 'shared/src/jvmSharedMain/kotlin/com/music/bitchord/playback/smart/BeatTracker.kt'
      - 'app/src/androidTest/java/com/music/bitchord/playback/smart/BeatTrackerNpuParityTest.kt'
      - 'app/src/androidTest/java/com/music/bitchord/playback/smart/BeatTrackerBenchmarkTest.kt'
      - 'app/build.gradle.kts'
      - 'wearos/build.gradle.kts'
      - '.github/workflows/android-npu-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'shared/src/jvmSharedMain/kotlin/com/music/bitchord/playback/smart/BeatTracker.kt'
      - 'app/src/androidTest/java/com/music/bitchord/playback/smart/BeatTrackerNpuParityTest.kt'
      - 'app/src/androidTest/java/com/music/bitchord/playback/smart/BeatTrackerBenchmarkTest.kt'
      - 'app/build.gradle.kts'
      - 'wearos/build.gradle.kts'
      - '.github/workflows/android-npu-tests.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  npu-parity-test:
    name: NPU Delegate Parity Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_AVD_HOME: /home/runner/.config/.android/avd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - id: cache-sdk
        uses: actions/cache@v4
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts', '**/gradle.properties') }}
      - name: Install SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/emulator" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "platforms;android-36" "platforms;android-30" "system-images;android-30;default;x86_64" "emulator" "platform-tools" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Run Parity Test
        run: ./gradlew :app:connectedDevDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.music.bitchord.playback.smart.BeatTrackerNpuParityTest --no-daemon

  npu-benchmark-test:
    name: NPU Delegate Benchmark (Cold L0)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_AVD_HOME: /home/runner/.config/.android/avd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - id: cache-sdk
        uses: actions/cache@v4
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts', '**/gradle.properties') }}
      - name: Install SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/emulator" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "platforms;android-36" "platforms;android-30" "system-images;android-30;default;x86_64" "emulator" "platform-tools" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Run Benchmark Test
        run: ./gradlew :app:connectedDevDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.music.bitchord.playback.smart.BeatTrackerBenchmarkTest --no-daemon

  delegate-availability:
    name: NPU Delegate Availability Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_AVD_HOME: /home/runner/.config/.android/avd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - id: cache-sdk
        uses: actions/cache@v4
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts', '**/gradle.properties') }}
      - name: Install SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/emulator" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "platforms;android-36" "platforms;android-30" "system-images;android-30;default;x86_64" "emulator" "platform-tools" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Check delegate availability
        run: ./gradlew :app:connectedDevDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.music.bitchord.playback.smart.BeatTrackerNpuParityTest#npuDelegateParity --no-daemon

      - name: Print delegate availability
        run: find app/build/outputs/androidTest-results -name "*.xml" -exec grep -l "Delegate availability" {} \;
