name: Android NPU Delegate Tests

on:
  push:
    branches: [main]
    paths:
      - 'shared/src/jvmSharedMain/kotlin/com/music/bitchord/playback/smart/BeatTracker.kt'
      - 'app/src/androidTest/java/com/music/bitchord/playback/smart/BeatTrackerNpuParityTest.kt'
      - 'app/src/androidTest/java/com/music/bitchord/playback/smart/BeatTrackerBenchmarkTest.kt'
      - '.github/workflows/android-npu-tests.yml'
  pull_request:
    paths:
      - 'shared/src/jvmSharedMain/kotlin/com/music/bitchord/playback/smart/BeatTracker.kt'
      - 'app/src/androidTest/java/com/music/bitchord/playback/smart/BeatTrackerNpuParityTest.kt'
      - 'app/src/androidTest/java/com/music/bitchord/playback/smart/BeatTrackerBenchmarkTest.kt'
      - '.github/workflows/android-npu-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npu-parity-test:
    name: NPU Delegate Parity Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 30
          emulator: true
          ndk-version: r26d

      - name: Start emulator (API 30, x86_64 for NNAPI support)
        uses: android-actions/start-emulator@v3
        with:
          api-level: 30
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -qemu -cpu max

      - name: Wait for emulator
        run: |
          adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
          adb shell input keyevent 82

      - name: Run NPU Parity Test
        run: |
          ./gradlew :app:connectedDevDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.music.bitchord.playback.smart.BeatTrackerNpuParityTest \
            --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npu-parity-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7

  npu-benchmark-test:
    name: NPU Delegate Benchmark (Cold L0)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 30
          emulator: true
          ndk-version: r26d

      - name: Start emulator (API 30, x86_64 for NNAPI support)
        uses: android-actions/start-emulator@v3
        with:
          api-level: 30
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -qemu -cpu max

      - name: Wait for emulator
        run: |
          adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
          adb shell input keyevent 82

      - name: Run NPU Benchmark Test
        run: |
          ./gradlew :app:connectedDevDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.music.bitchord.playback.smart.BeatTrackerBenchmarkTest \
            --no-daemon

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npu-benchmark-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7

  delegate-availability:
    name: NPU Delegate Availability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 30
          emulator: true
          ndk-version: r26d

      - name: Start emulator (API 30, x86_64 for NNAPI support)
        uses: android-actions/start-emulator@v3
        with:
          api-level: 30
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -qemu -cpu max

      - name: Wait for emulator
        run: |
          adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
          adb shell input keyevent 82

      - name: Check delegate availability
        run: |
          ./gradlew :app:connectedDevDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.music.bitchord.playback.smart.BeatTrackerNpuParityTest#npuDelegateParity \
            --no-daemon

      - name: Print delegate availability
        run: |
          # The test prints delegate availability to stdout; we capture it from the test results
          find app/build/outputs/androidTest-results -name "*.xml" -exec grep -l "Delegate availability" {} \;