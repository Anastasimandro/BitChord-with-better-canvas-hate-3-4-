name: Golden Corpus — Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'fixtures/golden-corpus.json'
      - '.github/workflows/golden-corpus-web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'fixtures/golden-corpus.json'
      - '.github/workflows/golden-corpus-web.yml'

permissions:
  contents: read

jobs:
  golden-corpus-web:
    name: Golden Corpus Web Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The pnpm version comes from web/package.json's packageManager.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # The workspace install lives at web/ (web/app depends on @bitchord/shared).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Run golden corpus tests
        run: pnpm exec vitest run golden-corpus.test.ts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-corpus-web-results
          path: |
            web/app/test-results/
            web/app/coverage/
          retention-days: 7
