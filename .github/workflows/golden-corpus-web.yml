name: Golden Corpus — Web

on:
  push:
    branches: [main]
    paths:
      - 'web/app/src/playback/automix/**'
      - 'fixtures/golden-corpus.json'
      - '.github/workflows/golden-corpus-web.yml'
  pull_request:
    paths:
      - 'web/app/src/playback/automix/**'
      - 'fixtures/golden-corpus.json'
      - '.github/workflows/golden-corpus-web.yml'

permissions:
  contents: read

jobs:
  golden-corpus-web:
    name: Golden Corpus Web Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run golden corpus tests
        run: npm test -- --run golden-corpus.test.ts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-corpus-web-results
          path: |
            web/app/test-results/
            web/app/coverage/
          retention-days: 7