name: Android Release APK

# Pipeline to build and publish signed APKs:
# 1. Pushing to 'main' triggers 'build-prod-release' which only compiles and
#    uploads CI artifacts (no GitHub Release is created).
# 2. Pushing a tag 'v*' (e.g. 'v1.9.2') triggers 'release-phone-and-wear' and
#    'release-tv' which compile release APKs and publish them as a GitHub Release.
#    If KEYSTORE_BASE64 is configured the APKs are signed; without it they are
#    published unsigned (useful for pipeline smoke-tests before the keystore is
#    added to repo secrets).
# 3. Dry-run / Manual Testing via workflow_dispatch:
#    - Trigger from the Actions tab; set 'publish_release' to false to skip
#      creating the GitHub Release (artifacts still upload).
#    - Set 'tag' to match the bitchordVersionName in root build.gradle.kts.

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/version override (e.g. v1.9.2). Defaults to git ref_name if empty.'
        required: false
        default: ''
      publish_release:
        description: 'Publish as a GitHub Release (set false to only build & upload workflow artifacts)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # CI artifact build for pushes to main (never creates a release)
  build-prod-release:
    name: Build Main Prod Artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Secrets (Keystore & local.properties)
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
            if [ -s bitchord-release.jks ]; then
              {
                echo "storeFile=bitchord-release.jks"
                echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
                echo "keyAlias=${{ secrets.KEY_ALIAS }}"
                echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
              } > keystore.properties
            fi
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Prod Release APK
        run: ./gradlew assembleProdRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-prod-release
          path: app/build/outputs/apk/prod/release/*.apk

      - name: Upload Wear OS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-wear-prod-release
          path: wearos/build/outputs/apk/prod/release/*.apk

  # Official Release Job: builds Phone universal + 3 splits + Wear APK, creates GitHub Release
  release-phone-and-wear:
    name: Release Phone & Wear APKs
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Secrets
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

          # Keystore is optional: without it the build produces unsigned APKs.
          # Once KEYSTORE_BASE64 is configured as a repo secret the APKs will
          # be signed automatically — no workflow change needed.
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
            if [ -s bitchord-release.jks ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
              {
                echo "storeFile=bitchord-release.jks"
                echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
                echo "keyAlias=${{ secrets.KEY_ALIAS }}"
                echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
              } > keystore.properties
              echo "SIGNING=release" >> $GITHUB_ENV
            else
              echo "SIGNING=fallback-debug" >> $GITHUB_ENV
            fi
          else
            echo "SIGNING=fallback-debug" >> $GITHUB_ENV
          fi

          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Validate Version Consistency
        run: |
          RAW_TAG="${{ inputs.tag || github.ref_name }}"
          TAG_VER="${RAW_TAG#v}"

          GRADLE_VER=$(grep 'extra\["bitchordVersionName"\]' build.gradle.kts | head -n 1 | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')
          BETA_SUFFIX=$(grep 'extra\["bitchordBetaSuffix"\]' build.gradle.kts | head -n 1 | sed -E 's/.*=[[:space:]]*"([^"]*)".*/\1/')

          echo "Tag version : $TAG_VER"
          echo "Gradle version: $GRADLE_VER"
          echo "Beta suffix : '${BETA_SUFFIX}'"

          if [ "$TAG_VER" != "$GRADLE_VER" ]; then
            echo "::error::Tag ($TAG_VER) does not match bitchordVersionName ($GRADLE_VER) in root build.gradle.kts"
            exit 1
          fi
          if [ -n "$BETA_SUFFIX" ]; then
            echo "::error::bitchordBetaSuffix is not empty ('$BETA_SUFFIX') — clear it before cutting a release"
            exit 1
          fi

          echo "RELEASE_TAG=v$GRADLE_VER" >> $GITHUB_ENV
          echo "RELEASE_VERSION=$GRADLE_VER" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Prod Release (Phone & Wear)
        run: ./gradlew assembleProdRelease

      - name: Stage Phone & Wear APKs
        run: |
          PHONE_DIR="app/build/outputs/apk/prod/release"
          WEAR_DIR="wearos/build/outputs/apk/prod/release"

          echo "=== Phone outputs ==="
          ls -la "$PHONE_DIR"
          echo "=== Wear outputs ==="
          ls -la "$WEAR_DIR"

          if [ "$SIGNING" = "unsigned" ]; then
            echo "::warning::No keystore configured — APKs are unsigned. Add KEYSTORE_BASE64 to repo secrets to publish signed builds."
          fi

          mkdir -p dist

          # Universal Phone APK: Gradle renames it to BitChord-v<ver>.apk;
          # fall back to any *universal* file if the rename did not apply.
          if [ -f "$PHONE_DIR/BitChord-${RELEASE_TAG}.apk" ]; then
            cp -v "$PHONE_DIR/BitChord-${RELEASE_TAG}.apk" dist/
          elif ls "$PHONE_DIR"/*universal*.apk 1> /dev/null 2>&1; then
            cp -v "$PHONE_DIR"/*universal*.apk "dist/BitChord-${RELEASE_TAG}.apk"
          else
            # Last resort: pick the first APK that is not a split
            UNIV=$(ls "$PHONE_DIR"/*.apk | grep -v -- '-arm' | grep -v -- '-x86' | head -n 1)
            if [ -n "$UNIV" ]; then
              cp -v "$UNIV" "dist/BitChord-${RELEASE_TAG}.apk"
            else
              echo "::error::Universal phone APK not found in $PHONE_DIR"
              exit 1
            fi
          fi

          # ABI splits
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "$PHONE_DIR/BitChord-${RELEASE_TAG}_${abi}.apk" ]; then
              cp -v "$PHONE_DIR/BitChord-${RELEASE_TAG}_${abi}.apk" dist/
            elif ls "$PHONE_DIR"/*"${abi}"*.apk 1> /dev/null 2>&1; then
              cp -v "$PHONE_DIR"/*"${abi}"*.apk "dist/BitChord-${RELEASE_TAG}_${abi}.apk"
            else
              echo "::warning::Split for $abi not found — skipping"
            fi
          done

          # Wear OS APK
          if ls "$WEAR_DIR"/BitChordWear*.apk 1> /dev/null 2>&1; then
            cp -v "$WEAR_DIR"/BitChordWear*.apk dist/
          elif ls "$WEAR_DIR"/*.apk 1> /dev/null 2>&1; then
            cp -v "$WEAR_DIR"/*.apk dist/
          else
            echo "::warning::Wear APK not found — skipping"
          fi

          echo "=== Staged files ==="
          ls -la dist/

      - name: Create GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release == true || inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
          files: dist/*

      - name: Upload Phone & Wear Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-${{ env.RELEASE_TAG }}-phone-wear
          path: dist/*

  # Release Job: builds TV universal + 3 splits, attaches to the same GitHub Release
  release-tv:
    name: Release TV APKs
    needs: [release-phone-and-wear]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Secrets
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
            if [ -s bitchord-release.jks ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
              {
                echo "storeFile=bitchord-release.jks"
                echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
                echo "keyAlias=${{ secrets.KEY_ALIAS }}"
                echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
              } > keystore.properties
              echo "SIGNING=release" >> $GITHUB_ENV
            else
              echo "SIGNING=fallback-debug" >> $GITHUB_ENV
            fi
          else
            echo "SIGNING=fallback-debug" >> $GITHUB_ENV
          fi

          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Determine Release Tag
        run: |
          GRADLE_VER=$(grep 'extra\["bitchordVersionName"\]' build.gradle.kts | head -n 1 | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')
          echo "RELEASE_TAG=v$GRADLE_VER" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build TV Prod Release
        run: ./gradlew :tv:assembleProdRelease

      - name: Stage TV APKs
        run: |
          TV_DIR="tv/build/outputs/apk/prod/release"
          echo "=== TV outputs ==="
          ls -la "$TV_DIR"

          if [ "$SIGNING" = "unsigned" ]; then
            echo "::warning::No keystore configured — TV APKs are unsigned."
          fi

          mkdir -p dist-tv

          # Universal TV APK
          if [ -f "$TV_DIR/BitChordTV-${RELEASE_TAG}.apk" ]; then
            cp -v "$TV_DIR/BitChordTV-${RELEASE_TAG}.apk" dist-tv/
          elif ls "$TV_DIR"/*universal*.apk 1> /dev/null 2>&1; then
            cp -v "$TV_DIR"/*universal*.apk "dist-tv/BitChordTV-${RELEASE_TAG}.apk"
          else
            UNIV=$(ls "$TV_DIR"/*.apk | grep -v -- '-arm' | grep -v -- '-x86' | head -n 1)
            if [ -n "$UNIV" ]; then
              cp -v "$UNIV" "dist-tv/BitChordTV-${RELEASE_TAG}.apk"
            else
              echo "::error::Universal TV APK not found in $TV_DIR"
              exit 1
            fi
          fi

          # ABI splits
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "$TV_DIR/BitChordTV-${RELEASE_TAG}_${abi}.apk" ]; then
              cp -v "$TV_DIR/BitChordTV-${RELEASE_TAG}_${abi}.apk" dist-tv/
            elif ls "$TV_DIR"/*"${abi}"*.apk 1> /dev/null 2>&1; then
              cp -v "$TV_DIR"/*"${abi}"*.apk "dist-tv/BitChordTV-${RELEASE_TAG}_${abi}.apk"
            else
              echo "::warning::TV split for $abi not found — skipping"
            fi
          done

          echo "=== Staged TV files ==="
          ls -la dist-tv/

      - name: Attach TV APKs to GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release == true || inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist-tv/*

      - name: Upload TV Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-${{ env.RELEASE_TAG }}-tv
          path: dist-tv/*
