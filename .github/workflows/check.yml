name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

      # The local debug key, so this APK installs over a local dev build and
      # back. Fork PRs get no secrets; AGP then makes a throwaway key itself.
      - name: Write the debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          [ -n "$DEBUG_KEYSTORE_BASE64" ] || exit 0
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - run: chmod +x gradlew

      - name: Tests
        # The full unit-test run carries the i18n parity tests
        # (LocaleStringsTest, LocalizationTest — see the i18nParityTest task
        # in app/build.gradle.kts); localeCoverage prints the per-language
        # gap next to their results. sharedUi's own parity test rides along
        # (:sharedUi:jvmTest runs SharedUiStringsTest — see the
        # sharedUiI18nParityTest task in sharedUi/build.gradle.kts), with its
        # own coverage table. :shared:jvmTest carries LocaleTagsTest (part 2's
        # tag-normalization guard) and the shared module's other JVM tests.
        # --continue so every task reports independently; the log is kept and
        # the diagnostics step below surfaces errors as annotations.
        run: ./gradlew testDevDebugUnitTest :shared:jvmTest :app:localeCoverage :sharedUi:jvmTest :sharedUi:sharedUiLocaleCoverage --continue 2>&1 | tee gradle-tests.log

      - name: Test failure diagnostics
        # The job log is not readable via the public API without a token, so
        # anything a remote maintainer needs to see goes out as annotations
        # and into the run summary instead.
        if: failure()
        run: |
          echo "## Gradle failures" >> "$GITHUB_STEP_SUMMARY"
          grep -nE "^> Task .*(FAILED)|error:|e: |FAILED [0-9]+ tests|Execution failed for task" gradle-tests.log | head -80 >> "$GITHUB_STEP_SUMMARY" || true
          grep -nE "error:|e: |Execution failed for task" gradle-tests.log | head -40 || true
          while IFS= read -r line; do echo "::error::${line//\"/\'}"; done < <(grep -E "error:|e: |Execution failed for task" gradle-tests.log | head -20)
          echo "## Failing test XMLs" >> "$GITHUB_STEP_SUMMARY"
          found=0
          for f in $(find . -path '*/build/test-results/*' -name '*.xml' 2>/dev/null); do
            if grep -q '<failure' "$f"; then
              found=1
              echo "### $f" >> "$GITHUB_STEP_SUMMARY"
              grep -A3 '<failure' "$f" | head -20 >> "$GITHUB_STEP_SUMMARY"
              echo "::error::failing test results: $f"
            fi
          done
          if [ "$found" = "0" ]; then echo "(no failing test XMLs — the failure is before test execution)" >> "$GITHUB_STEP_SUMMARY"; fi
          echo "## Test results present" >> "$GITHUB_STEP_SUMMARY"
          find . -path '*/build/test-results/*' -name '*.xml' 2>/dev/null | head -40 >> "$GITHUB_STEP_SUMMARY" || true

      # The language-system redesign (docs/language-system-prompts/) acceptance
      # battery: every Gradle module that ships strings is assembled here in
      # one go. The modules carry a dev/prod env flavor, so the flavor-scoped
      # DevDebug tasks stand in for the bare assembleDebug names.
      - name: Acceptance build battery
        run: ./gradlew :app:assembleDevDebug :wearos:assembleDevDebug :tv:assembleDevDebug

      - name: Build the dev APK
        run: ./gradlew assembleDevDebug

      - name: Upload the dev APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/
            shared/build/reports/tests/
            sharedUi/build/reports/tests/
          if-no-files-found: ignore

  backend:
    name: Backend · Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
