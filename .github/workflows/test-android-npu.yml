name: Test Android NPU Three Jobs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-android-npu.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test-android-npu.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  npu-parity-test:
    name: NPU Delegate Parity Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_AVD_HOME: /home/runner/.config/.android/avd
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Test
        run: echo "hello"

  npu-benchmark-test:
    name: NPU Delegate Benchmark (Cold L0)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_AVD_HOME: /home/runner/.config/.android/avd
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Test
        run: echo "hello"

  delegate-availability:
    name: NPU Delegate Availability Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_AVD_HOME: /home/runner/.config/.android/avd
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Test
        run: echo "hello"