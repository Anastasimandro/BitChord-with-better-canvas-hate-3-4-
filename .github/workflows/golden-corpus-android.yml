name: Golden Corpus — Android

on:
  push:
    branches: [main]
    paths:
      - 'shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/**'
      - 'shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/**'
      - 'fixtures/golden-corpus.json'
      - '.github/workflows/golden-corpus-android.yml'
  pull_request:
    paths:
      - 'shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/**'
      - 'shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/**'
      - 'fixtures/golden-corpus.json'
      - '.github/workflows/golden-corpus-android.yml'

permissions:
  contents: read

jobs:
  golden-corpus-android:
    name: Golden Corpus Android Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run golden corpus tests (JVM)
        # commonTest rides each JVM target; jvmTest is the one that takes --tests.
        run: ./gradlew :shared:jvmTest --tests "com.music.bitchord.playback.smart.GoldenCorpusTest" --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-corpus-android-results
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
          retention-days: 7